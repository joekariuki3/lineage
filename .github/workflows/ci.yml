name: CI for lineage

on:
  push:
    branches: [master, develop, "feature/**", "ui/**"]
  pull_request:
    branches: [master, develop]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-prettier:
    name: Prettier-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Prettier check
        run: npx prettier --check "**/*.{html,css,js,md,yml,yaml}"

  lint-python:
    name: Ruff-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt
          pip install ruff
      - name: Ruff lint
        run: ruff check .

  Bandit-Security-Scan:
    name: Bandit-Security-Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Bandit security check
        run: bandit -c pyproject.toml  -r .

  Safety-security-scan:
    name: Safety-Security-Scan
    runs-on: ubuntu-latest
    needs: Bandit-Security-Scan
    steps:
      - name: Install safety
        run: pip install safety
      - name: Safety dependency check
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: safety scan

  test:
    runs-on: ubuntu-latest
    needs: [lint, Bandit-Security-Scan, Safety-security-scan]
    env:
      GUEST_NAME: ${{ secrets.GUEST_NAME }}
      GUEST_EMAIL: ${{ secrets.GUEST_EMAIL }}
      GUEST_PASSWORD: ${{ secrets.GUEST_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests
